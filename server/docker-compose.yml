# Production stack on the VPS: Caddy (web + HTTPS) and PocketBase (API + SQLite).
# Lives in /srv/hb7 on the server; CI copies this folder there and runs `docker compose up -d --build`.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
      args:
        PB_VERSION: 0.40.6
    restart: unless-stopped
    env_file: .env
    # automigrate off in production: schema changes come only from server/pb_migrations in git
    command: ['/pb/pocketbase', 'serve', '--http=0.0.0.0:8090', '--origins=${PB_ORIGINS}', '--automigrate=false']
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_migrations:/pb/pb_migrations:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  caddy_data:
  caddy_config:
